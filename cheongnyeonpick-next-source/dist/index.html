<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ed">
  <meta name="description" content="사는 곳과 학교, 지금 내 상황을 함께 살펴보는 청년 정책 준비 서비스. 청년픽 NEXT 프로토타입입니다.">
  <title>청년픽 NEXT · 내 다음을, 가볍게 픽!</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="wallet.css"><link rel="stylesheet" href="assets/redesign.css">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="청년픽 NEXT 홈"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M6 17V7l12 10V7" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>청년픽 <span class="brand-next">NEXT</span></a>
      <nav class="desktop-nav" id="sideNav" aria-label="주 메뉴"></nav>
      <div class="top-actions"><button class="demo-button" data-action="about">프로토타입</button><button class="icon-button" data-action="notifications" aria-label="알림 확인"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-2.5 7-2.5 9h17C20.5 15 18 15 18 8Z"/><path d="M10 21h4"/></svg></button><button class="profile-button" data-route="profile" aria-label="내 정보 열기">내</button></div>
      <span class="sr-only" id="topbarTitle"></span><span class="sr-only" id="sideRegion"></span>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
  <nav class="bottom-nav" id="bottomNav" aria-label="하단 메뉴"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="infoDialog" aria-labelledby="dialogTitle"><div class="dialog-header"><h2 id="dialogTitle"></h2><button class="icon-button" data-action="close-dialog" aria-label="닫기"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="dialogBody" class="dialog-copy"></div></dialog>
  <script src="wallet.js" defer></script>
  <script src="assets/base.js" defer></script><script src="assets/redesign.js" defer></script>
</body>
</html>
